<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Dot Dome</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg-main: transparent;
  --accent-cyan: #00f3ff;
  --accent-pink: #ff0055;
  --text-main: #f8fafc;
  --text-muted: #94a3b8;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

body {
  margin: 0;
  padding: 10px;
  background: transparent;
  color: var(--text-main);
  font-family: 'Rajdhani', sans-serif;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
}

.game-layout {
  display: flex;
  flex-direction: row;
  align-items: center;
  justify-content: center;
  gap: 20px;
  width: min(540px, 98vw);
  height: min(400px, 92vh);
}

.board-wrap {
  width: min(320px, 64vw);
  height: min(320px, 64vw);
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  touch-action: none;
}

.board {
  position: relative;
}

.dot {
  position: absolute;
  width: 9px;
  height: 9px;
  background: #ffffff;
  border-radius: 50%;
  transform: translate(-50%, -50%);
  z-index: 5;
  cursor: pointer;
  transition: transform 0.15s ease, background 0.15s ease;
  box-shadow: 0 0 6px rgba(255, 255, 255, 0.8);
}
.dot:hover, .dot.selected {
  background: var(--accent-pink);
  transform: translate(-50%, -50%) scale(1.6);
  box-shadow: 0 0 10px var(--accent-pink);
}

.line {
  position: absolute;
  border-radius: 2px;
  z-index: 2;
  background: var(--accent-cyan);
  box-shadow: 0 0 6px var(--accent-cyan);
}
.line.h { height: 3px; transform: translateY(-50%); }
.line.v { width: 3px; transform: translateX(-50%); }

.claimed {
  position: absolute;
  z-index: 1;
  border-radius: 3px;
  opacity: 0.8;
}

.hud-side {
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: flex-start;
  min-width: 120px;
}

.game-heading {
  font-family: 'Orbitron', sans-serif;
  font-size: 20px;
  letter-spacing: 2px;
  margin: 0 0 8px 0;
  background: linear-gradient(45deg, var(--accent-cyan), var(--accent-pink));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.turn-subheading {
  font-size: 11px;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 1px;
  margin: 0;
}

.player-turn-name {
  font-family: 'Orbitron', sans-serif;
  font-size: 15px;
  font-weight: 700;
  margin-top: 2px;
  transition: color 0.3s ease;
}

.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(7, 10, 18, 0.92);
  backdrop-filter: blur(8px);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 100;
}

.modal-box {
  background: #121829;
  border: 1px solid var(--accent-cyan);
  border-radius: 12px;
  padding: 20px;
  width: min(320px, 86vw);
  text-align: center;
  box-shadow: 0 0 30px rgba(0, 243, 255, 0.2);
}

.modal-box h3 {
  font-family: 'Orbitron', sans-serif;
  font-size: 16px;
  margin: 0 0 14px;
  color: var(--accent-cyan);
}

.grid-choices {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.grid-btn {
  background: rgba(255, 255, 255, 0.06);
  border: 1px solid rgba(255, 255, 255, 0.15);
  color: #fff;
  padding: 10px;
  border-radius: 8px;
  font-family: 'Orbitron', sans-serif;
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.2s;
}
.grid-btn:hover {
  background: var(--accent-cyan);
  color: #000;
  box-shadow: 0 0 12px var(--accent-cyan);
}

.leaderboard-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 6px 10px;
  margin-bottom: 6px;
  background: rgba(255, 255, 255, 0.05);
  border-radius: 6px;
  font-size: 13px;
  border-left: 3px solid;
}

.hidden { display: none !important; }
</style>
</head>
<body>

<div class="game-layout">
  <div class="board-wrap">
    <div id="board" class="board"></div>
  </div>

  <div class="hud-side">
    <h1 class="game-heading">DOT DOME</h1>
    <span class="turn-subheading">Turn</span>
    <div id="lblTurn" class="player-turn-name">—</div>
  </div>
</div>

<!-- Modal 1: Grid Size Chooser -->
<div id="sizeModal" class="modal-overlay">
  <div class="modal-box">
    <h3 id="sizeModalTitle">SELECT GRID SIZE</h3>
    <div id="sizeChoices" class="grid-choices">
      <button class="grid-btn" onclick="chooseSize(5)">5 x 5</button>
      <button class="grid-btn" onclick="chooseSize(8)">8 x 8</button>
      <button class="grid-btn" onclick="chooseSize(10)">10 x 10</button>
      <button class="grid-btn" onclick="chooseSize(20)">20 x 20</button>
    </div>
    <p id="waitHostMsg" class="hidden" style="color:var(--text-muted); font-size:13px; margin:10px 0 0;">Waiting for Host to choose grid size...</p>
  </div>
</div>

<!-- Modal 2: Final Result -->
<div id="winnerModal" class="modal-overlay hidden">
  <div class="modal-box">
    <h3 id="winnerTitle">🏆 WINNER</h3>
    <div id="finalScoresList" style="margin: 14px 0;"></div>
    <button id="btnPlayAgain" class="grid-btn" onclick="restartPrompt()" style="width:100%; background:var(--accent-cyan); color:#000;">Play Again</button>
  </div>
</div>

<script>
const COLORS = ['#00f3ff', '#ff0055', '#a855f7', '#ffcc00', '#22c55e', '#f97316', '#00ffaa', '#e11d48'];

let size = 5;
let players = [];
let currentIndex = 0;
let lines = new Set();
let boxes = new Map();
let selected = null;
let myUid = null;
let isHost = false;

const $ = id => document.getElementById(id);

function node(r, c) { return r + ',' + c; }
function lineKey(a, b) { return a < b ? a + '|' + b : b + '|' + a; }

// Window Message Listener (From Parent Script.js)
window.addEventListener('message', e => {
  if(!e.data) return;

  if(e.data.type === 'INIT_ROOM_PLAYERS'){
    const pData = e.data.payload;
    myUid = pData.myUid;
    isHost = pData.isHost;

    if(pData.players && pData.players.length > 0){
      players = pData.players.map((m, idx) => ({
        id: m.uid,
        name: m.name,
        color: COLORS[idx % COLORS.length],
        score: 0
      }));
    } else {
      players = [{ id: myUid || 'p1', name: 'Player 1', color: COLORS[0], score: 0 }];
    }

    if(!isHost){
      $('sizeChoices').classList.add('hidden');$('waitHostMsg').classList.remove('hidden');
    }
  }

  if(e.data.type === 'DOTDOME_REMOTE_ACTION'){
    handleRemoteAction(e.data.payload);
  }
});

function sendAction(actionData){
  window.parent.postMessage({
    type: 'DOTDOME_LOCAL_ACTION',
    payload: actionData
  }, '*');
}

function chooseSize(selectedSize){
  if(!isHost && players.length > 1) return;
  size = selectedSize;
  $('sizeModal').classList.add('hidden');
  
  sendAction({
    act: 'START_GAME',
    size: size,
    players: players
  });

  startGame();
}

function handleRemoteAction(data){
  if(data.act === 'START_GAME'){
    size = data.size;
    if(data.players) players = data.players;
    $('sizeModal').classList.add('hidden');
    startGame();
  } else if(data.act === 'DRAW_LINE'){
    applyLineMove(data.a, data.b, data.playerUid);
  } else if(data.act === 'RESTART'){
    $('winnerModal').classList.add('hidden');
    if(isHost){
      $('sizeChoices').classList.remove('hidden');$('waitHostMsg').classList.add('hidden');
    } else {
      $('sizeChoices').classList.add('hidden');$('waitHostMsg').classList.remove('hidden');
    }
    $('sizeModal').classList.remove('hidden');
  }
}

function startGame(){
  lines.clear();
  boxes.clear();
  selected = null;
  currentIndex = 0;
  players.forEach(p => p.score = 0);
  buildBoard();
  updateTurnUI();
}

function buildBoard(){
  const board = $('board');
  board.innerHTML = '';
  
  const boardWrap = document.querySelector('.board-wrap');
  const maxDim = boardWrap.clientWidth - 16;
  const step = Math.floor(maxDim / (size - 1));

  board.style.width = ((size - 1) * step) + 'px';
  board.style.height = ((size - 1) * step) + 'px';

  for(let r = 0; r < size; r++){
    for(let c = 0; c < size; c++){
      const d = document.createElement('div');
      d.className = 'dot';
      d.style.left = (c * step) + 'px';
      d.style.top = (r * step) + 'px';
      d.dataset.r = r;
      d.dataset.c = c;

      if(size >= 10){ d.style.width = '6px'; d.style.height = '6px'; }
      if(size === 20){ d.style.width = '4px'; d.style.height = '4px'; }

      d.onclick = () => dotClick(r, c);
      board.appendChild(d);
    }
  }
  redrawBoard();
}

function dotClick(r, c){
  const current = players[currentIndex];
  // Turn Validation: Only current turn player can make a move
  if(myUid && current && current.id !== myUid) return;

  if(selected === null){
    selected = [r, c];
    highlightSelected();
    return;
  }

  const [r1, c1] = selected;
  if(r1 === r && c1 === c){
    selected = null;
    highlightSelected();
    return;
  }

  if(Math.abs(r1 - r) + Math.abs(c1 - c) !== 1){
    selected = [r, c];
    highlightSelected();
    return;
  }

  selected = null;
  highlightSelected();

  const a = node(r1, c1), b = node(r, c);
  const key = lineKey(a, b);
  if(lines.has(key)) return;

  sendAction({
    act: 'DRAW_LINE',
    a: a,
    b: b,
    playerUid: current.id
  });

  applyLineMove(a, b, current.id);
}

function applyLineMove(a, b, playerUid){
  const key = lineKey(a, b);
  if(lines.has(key)) return;

  lines.add(key);

  const [r1, c1] = a.split(',').map(Number);
  const [r2, c2] = b.split(',').map(Number);
  const p = players.find(x => x.id === playerUid) || players[currentIndex];
  let made = 0;

  if(r1 === r2){
    const row = r1, col = Math.min(c1, c2);
    if(row > 0 && boxComplete(row - 1, col)){ if(claimBox(row - 1, col, p)) made++; }
    if(row < size - 1 && boxComplete(row, col)){ if(claimBox(row, col, p)) made++; }
  } else {
    const col = c1, row = Math.min(r1, r2);
    if(col > 0 && boxComplete(row, col - 1)){ if(claimBox(row, col - 1, p)) made++; }
    if(col < size - 1 && boxComplete(row, col)){ if(claimBox(row, col, p)) made++; }
  }

  if(!made){
    currentIndex = (currentIndex + 1) % players.length;
  }

  redrawBoard();
  updateTurnUI();
  checkWinner();
}

function highlightSelected(){
  document.querySelectorAll('.dot').forEach(d => {
    const isSel = selected && +d.dataset.r === selected[0] && +d.dataset.c === selected[1];
    d.classList.toggle('selected', isSel);
  });
}

function boxComplete(r, c){
  const top = lineKey(node(r, c), node(r, c + 1));
  const bottom = lineKey(node(r + 1, c), node(r + 1, c + 1));
  const left = lineKey(node(r, c), node(r + 1, c));
  const right = lineKey(node(r, c + 1), node(r + 1, c + 1));
  return lines.has(top) && lines.has(bottom) && lines.has(left) && lines.has(right);
}

function claimBox(r, c, p){
  const k = node(r, c);
  if(!boxes.has(k)){
    boxes.set(k, p.id);
    p.score++;
    return true;
  }
  return false;
}

function redrawBoard(){
  const b = $('board');
  b.querySelectorAll('.line,.claimed').forEach(x => x.remove());
  const step = b.offsetWidth / (size - 1);

  lines.forEach(k => {
    const [a, z] = k.split('|');
    const [r1, c1] = a.split(',').map(Number);
    const [r2, c2] = z.split(',').map(Number);
    const e = document.createElement('div');
    e.className = 'line ' + (r1 === r2 ? 'h' : 'v');
    if(r1 === r2){
      e.style.left = Math.min(c1, c2) * step + 'px';
      e.style.top = r1 * step + 'px';
      e.style.width = step + 'px';
    } else {
      e.style.left = c1 * step + 'px';
      e.style.top = Math.min(r1, r2) * step + 'px';
      e.style.height = step + 'px';
    }
    b.appendChild(e);
  });

  boxes.forEach((pid, k) => {
    const [r, c] = k.split(',').map(Number);
    const p = players.find(x => x.id === pid);
    if(!p) return;
    const e = document.createElement('div');
    e.className = 'claimed';
    e.style.left = (c * step + 1) + 'px';
    e.style.top = (r * step + 1) + 'px';
    e.style.width = (step - 2) + 'px';
    e.style.height = (step - 2) + 'px';
    e.style.background = p.color;
    e.style.boxShadow = `0 0 8px ${p.color}`;
    b.appendChild(e);
  });
}

function updateTurnUI(){
  const curr = players[currentIndex];
  const lbl = $('lblTurn');
  if(curr && lbl){
    lbl.textContent = curr.name + (myUid && curr.id === myUid ? ' (You)' : '');
    lbl.style.color = curr.color;
    lbl.style.textShadow = `0 0 10px ${curr.color}`;
  }
}

function checkWinner(){
  const totalBoxes = (size - 1) * (size - 1);
  if(boxes.size === totalBoxes){
    const sorted = [...players].sort((a, b) => b.score - a.score);
    const winner = sorted[0];

    $('winnerTitle').innerHTML = `🏆 ${winner.name} WINS!`;
    $('winnerTitle').style.color = winner.color;

    $('finalScoresList').innerHTML = sorted.map((p, idx) => `
      <div class="leaderboard-row" style="border-left-color: ${p.color};">
        <div>
          <strong style="margin-right: 6px;">#${idx + 1}</strong>
          <span style="color: ${p.color}; font-weight: bold;">${p.name}</span>
        </div>
        <strong style="font-family:'Orbitron'; font-size:12px;">${p.score} Boxes</strong>
      </div>
    `).join('');

    if(!isHost){
      $('btnPlayAgain').classList.add('hidden');
    } else {
      $('btnPlayAgain').classList.remove('hidden');
    }

    $('winnerModal').classList.remove('hidden');
  }
}

function restartPrompt(){
  if(!isHost && players.length > 1) return;
  sendAction({ act: 'RESTART' });
  handleRemoteAction({ act: 'RESTART' });
}

window.addEventListener('resize', buildBoard);
</script>
</body>
</html>
